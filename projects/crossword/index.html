<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Data Science Crossword</title><style>body{font-family:system-ui;background:#0b1220;color:#eaf0ff;margin:0;padding:28px}main{max-width:1000px;margin:auto}a{color:#82d9ff}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:28px}.board{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));max-width:620px;border:2px solid #456}.cell{aspect-ratio:1;background:white;position:relative;border:1px solid #cbd5e1}.cell input{width:100%;height:100%;box-sizing:border-box;border:0;text-align:center;font-size:clamp(12px,2vw,22px);font-weight:700;text-transform:uppercase;background:transparent}.cell small{position:absolute;top:0;left:2px;font-size:9px;color:#334155;pointer-events:none}.blank{background:#15233c}.wrong input{background:#fecaca}.correct input{background:#bbf7d0}button{padding:10px 16px;border:0;border-radius:8px;margin:6px 6px 6px 0;cursor:pointer;background:#7dd3fc;color:#102030;font-weight:bold}aside{background:#16243a;padding:16px;border-radius:12px}li{margin-bottom:12px}#status{min-height:1.5em}@media(max-width:720px){.layout{grid-template-columns:1fr}body{padding:14px}}</style><main><p><a href="../../index.html">← Portfolio</a></p><h1>Data Science Crossword</h1><p>Play a short crossword about coding and data science. Enter one letter per square, then check your answers.</p><div class="layout"><section><div class="board" id="board" aria-label="Crossword puzzle"></div><p><button id="check">Check answers</button><button id="reveal">Reveal puzzle</button><button id="reset">Reset</button></p><p id="status" aria-live="polite"></p></section><aside><h2>Clues</h2><div id="clues"></div></aside></div></main><script>const data={"cells": [{"row": 1, "col": 9, "number": 1, "letter": "G"}, {"row": 1, "col": 10, "number": null, "letter": "R"}, {"row": 1, "col": 11, "number": null, "letter": "A"}, {"row": 1, "col": 12, "number": null, "letter": "P"}, {"row": 1, "col": 13, "number": null, "letter": "H"}, {"row": 3, "col": 5, "number": 2, "letter": "A"}, {"row": 4, "col": 5, "number": null, "letter": "R"}, {"row": 4, "col": 9, "number": 3, "letter": "M"}, {"row": 4, "col": 10, "number": null, "letter": "O"}, {"row": 4, "col": 11, "number": null, "letter": "D"}, {"row": 4, "col": 12, "number": null, "letter": "E"}, {"row": 4, "col": 13, "number": null, "letter": "L"}, {"row": 5, "col": 5, "number": null, "letter": "R"}, {"row": 6, "col": 5, "number": null, "letter": "A"}, {"row": 7, "col": 4, "number": 4, "letter": "P"}, {"row": 7, "col": 5, "number": null, "letter": "Y"}, {"row": 7, "col": 6, "number": null, "letter": "T"}, {"row": 7, "col": 7, "number": null, "letter": "H"}, {"row": 7, "col": 8, "number": null, "letter": "O"}, {"row": 7, "col": 9, "number": null, "letter": "N"}, {"row": 10, "col": 9, "number": 5, "letter": "T"}, {"row": 10, "col": 10, "number": null, "letter": "A"}, {"row": 10, "col": 11, "number": null, "letter": "B"}, {"row": 10, "col": 12, "number": null, "letter": "L"}, {"row": 10, "col": 13, "number": null, "letter": "E"}, {"row": 13, "col": 9, "number": 6, "letter": "Q"}, {"row": 13, "col": 10, "number": null, "letter": "U"}, {"row": 13, "col": 11, "number": null, "letter": "E"}, {"row": 13, "col": 12, "number": null, "letter": "R"}, {"row": 13, "col": 13, "number": null, "letter": "Y"}], "clues": [{"number": 4, "direction": "Across", "clue": "Popular language for data analysis", "answer": "PYTHON", "row": 7, "col": 4}, {"number": 2, "direction": "Down", "clue": "Ordered collection of elements", "answer": "ARRAY", "row": 3, "col": 5}, {"number": 1, "direction": "Across", "clue": "Nodes connected by edges", "answer": "GRAPH", "row": 1, "col": 9}, {"number": 3, "direction": "Across", "clue": "A simplified representation used for prediction", "answer": "MODEL", "row": 4, "col": 9}, {"number": 5, "direction": "Across", "clue": "Data arranged in rows and columns", "answer": "TABLE", "row": 10, "col": 9}, {"number": 6, "direction": "Across", "clue": "A request for information from a database", "answer": "QUERY", "row": 13, "col": 9}]};const board=document.getElementById('board');const map=new Map(data.cells.map(c=>[`${c.row},${c.col}`,c]));const inputs=new Map();for(let r=0;r<15;r++)for(let c=0;c<15;c++){const x=map.get(`${r},${c}`);const d=document.createElement('div');d.className=x?'cell':'blank';if(x){if(x.number){let s=document.createElement('small');s.textContent=x.number;d.append(s)}let input=document.createElement('input');input.maxLength=1;input.setAttribute('aria-label',`Row ${r+1} column ${c+1}`);input.addEventListener('input',()=>{input.value=input.value.replace(/[^a-z]/gi,'').toUpperCase();d.classList.remove('wrong','correct')});d.append(input);inputs.set(`${r},${c}`,input)}board.append(d)}const el=document.getElementById('clues');for(const dir of ['Across','Down']){let h=document.createElement('h3');h.textContent=dir;el.append(h);let ul=document.createElement('ul');for(const x of data.clues.filter(c=>c.direction===dir)){let li=document.createElement('li');li.textContent=`${x.number}. ${x.clue} (${x.answer.length})`;ul.append(li)}el.append(ul)}document.getElementById('check').onclick=()=>{let right=0;for(const [key,input] of inputs){let good=input.value===map.get(key).letter;input.parentElement.classList.toggle('correct',good);input.parentElement.classList.toggle('wrong',!good);if(good)right++}document.getElementById('status').textContent=right===inputs.size?'Perfect! You solved it!':`${right} of ${inputs.size} squares correct.`};document.getElementById('reveal').onclick=()=>{for(const [key,input] of inputs){input.value=map.get(key).letter;input.parentElement.className='cell correct'}document.getElementById('status').textContent='Solution revealed.'};document.getElementById('reset').onclick=()=>{for(const input of inputs.values()){input.value='';input.parentElement.className='cell'}document.getElementById('status').textContent=''};</script></html>
